name: Release

# Publishes a stable GitHub Release when an approved vX.Y.Z tag is pushed.
# The tag must be created by the project owner after the release PR
# (docs first) is merged. Releases are published directly (never as drafts).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets are present
        env:
          MYPEN_KEYSTORE_BASE64: ${{ secrets.MYPEN_KEYSTORE_BASE64 }}
          MYPEN_STORE_PASSWORD: ${{ secrets.MYPEN_STORE_PASSWORD }}
          MYPEN_KEY_ALIAS: ${{ secrets.MYPEN_KEY_ALIAS }}
          MYPEN_KEY_PASSWORD: ${{ secrets.MYPEN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in MYPEN_KEYSTORE_BASE64 MYPEN_STORE_PASSWORD MYPEN_KEY_ALIAS MYPEN_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing secret $name is not set."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode the release keystore
        env:
          MYPEN_KEYSTORE_BASE64: ${{ secrets.MYPEN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$MYPEN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mypen-release.jks"
          chmod 600 "$RUNNER_TEMP/mypen-release.jks"

      - name: Build the release APK
        env:
          MYPEN_KEYSTORE_PATH: ${{ runner.temp }}/mypen-release.jks
          MYPEN_STORE_PASSWORD: ${{ secrets.MYPEN_STORE_PASSWORD }}
          MYPEN_KEY_ALIAS: ${{ secrets.MYPEN_KEY_ALIAS }}
          MYPEN_KEY_PASSWORD: ${{ secrets.MYPEN_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename the APK and compute its checksum
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Signed APK not found at $APK_SRC"
            exit 1
          fi
          APK_NAME="My Pen V${VERSION}.apk"
          cp "$APK_SRC" "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.apk_name }}" \
            "${{ steps.package.outputs.apk_name }}.sha256" \
            --title "My Pen ${GITHUB_REF_NAME}" \
            --generate-notes
